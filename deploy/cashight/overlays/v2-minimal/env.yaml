# Non-secret environment for cashight-api (docs/container-runtime.md). Secrets
# stay in SSM. Compared with overlays/v2/env.yaml: no GEMINI_PARAM (AI
# summaries are off), no OTLP endpoint (no collector), no parse queue URLs
# (the API never sends to them; S3 notifies the queues).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cashight-env
data:
  STORAGE_REGION: ap-southeast-1
  # terraform -chdir=terraform/v2 output
  TABLE_NAME: cashight-v2
  STATEMENTS_BUCKET: cashight-v2-statements-010382427026
  UPLOAD_BUCKET: cashight-v2-uploads-010382427026
  EXPORT_BUCKET: cashight-v2-cost-exports-010382427026
  # The shared v1 user pool; SPA client, then smoke client.
  COGNITO_USER_POOL_ID: ap-southeast-1_ZazpeBFju
  COGNITO_CLIENT_IDS: hov5lam4116ign4rqasg0fr3v,4qubu4pgbemaq4pi843p3lk1gc
  ALLOWED_ORIGIN: https://cashight-v2.nghuy.link
  # /summaries and /aws/invoices/summary are not registered; they answer 404.
  AI_SUMMARY_ENABLED: "false"
  REQUEST_TIMEOUT_MS: "29000"
  SHUTDOWN_DELAY_MS: "5000"
  SHUTDOWN_HARD_DEADLINE_MS: "30000"
  # Rewritten with the image by scripts/platform/pin-image.sh.
  APP_VERSION: 4f10a22ec2818a286cdbd6bf724dd631246087df
