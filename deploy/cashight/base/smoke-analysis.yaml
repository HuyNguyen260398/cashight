# The canary gate (spec §4.5, Plan 3 handover item 7): a Job that fails unless
# the canary pods answer /readyz and /health. No metrics AnalysisTemplate.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke
spec:
  args:
    - name: service
    - name: canary-hash
  metrics:
    - name: smoke
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 120
            ttlSecondsAfterFinished: 600
            template:
              metadata:
                labels:
                  cashight.nghuy.link/role: smoke
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  # curlimages/curl runs as curl_user (100); a numeric UID
                  # lets the kubelet verify runAsNonRoot.
                  runAsUser: 100
                  runAsGroup: 101
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke
                    # curlimages/curl:8.17.0 (multi-arch index)
                    image: curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
                    command: ["sh", "-c"]
                    # Passes after 3 consecutive /health answers from the
                    # canary hash. The canary Service selects the stable pods
                    # until the canary pods are available, and a stable pod
                    # being scaled down answers 503 while it drains, so a
                    # single request proves nothing. Fails after 90 s.
                    args:
                      - >-
                        want='"revision":"{{args.canary-hash}}"';
                        streak=0;
                        for attempt in $(seq 1 30); do
                        body=$(curl --fail --silent --max-time 5 "http://{{args.service}}:8080/health" || true);
                        case "$body" in *"$want"*) streak=$((streak + 1)) ;; *) streak=0 ;; esac;
                        if [ "$streak" -ge 3 ]; then echo "canary {{args.canary-hash}} healthy"; exit 0; fi;
                        sleep 3;
                        done;
                        echo "canary {{args.canary-hash}} not reached: last /health answer '$body'";
                        exit 1
                    resources:
                      requests:
                        cpu: 50m
                        memory: 32Mi
                      limits:
                        memory: 64Mi
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
