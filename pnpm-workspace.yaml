packages:
  - 'packages/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.25
  protobufjs: 7.6.5
  undici: 7.30.1
  source-map-js: 1.2.2
  baseline-browser-mapping: 2.11.28
  vite: 8.1.6
  # Pinned to the patched release for the audit. Inert here regardless: next.config.ts sets output:'export' with
  # images.unoptimized, so sharp is never invoked.
  sharp: 0.35.5
  # Two majors are in the tree: minimatch@3 (eslint) wants 1.x, minimatch@10
  # (typescript-eslint) wants 5.x. Both lines have their own advisory.
  'brace-expansion@1': 1.1.21
  'brace-expansion@5': 5.0.12

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS on deeply nested patterns. No patched
    # release exists (3.0.3 is the latest), and the only path is lint tooling:
    # eslint-config-next > @next/eslint-plugin-next > fast-glob@3.3.1 (pinned)
    # > micromatch > braces. It never processes untrusted input. Drop this
    # entry once braces publishes a fix.
    - GHSA-vfj7-8cjw-p6xm
    # minimatch <11.0.1 globparts-amplification DoS. Only reached through lint
    # tooling (eslint, @typescript-eslint/typescript-estree), which pin older
    # majors with no backported fix; overriding them to 11 breaks their API.
    # Globs come from our own config, never untrusted input. Drop this entry
    # once eslint and typescript-eslint move to minimatch >=11.0.1.
    - GHSA-g3hv-75wg-m249

minimumReleaseAgeExclude:
  - '@next/env@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - next@16.4.5
  - '@next/eslint-plugin-next@16.4.5'
  - eslint-config-next@16.4.5
