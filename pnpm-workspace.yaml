packages:
  - 'packages/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - js-yaml@4.3.1

overrides:
  js-yaml: 4.3.1
  nanoid: 3.3.17
  postcss: 8.5.25
  protobufjs: 7.6.5
  undici: 7.29.0
  vite: 8.0.16
  # next pins sharp ^0.34.5 and cannot reach the patched 0.35.x on its own.
  # Inert here regardless: next.config.ts sets output:'export' with
  # images.unoptimized, so sharp is never invoked.
  sharp: 0.35.3
  # Two majors are in the tree: minimatch@3 (eslint) wants 1.x, minimatch@10
  # (typescript-eslint) wants 5.x. Both lines have their own advisory.
  'brace-expansion@1': 1.1.18
  'brace-expansion@5': 5.0.9
