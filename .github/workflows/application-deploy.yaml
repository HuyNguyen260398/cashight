name: Application Deploy

# Deploys Lambda canaries and frontend from a specific CI run's artifacts.
# Everything downstream keys off one resolved CI run ID, which pins the exact
# artifact set so the deploy stays identical even when new commits land on main
# mid-deploy. Nothing is rebuilt here — what ships is what CI validated.
#
# Two ways in:
#   - a PR merged into main       → resolve that PR's green CI run
#   - manual dispatch + ci_run_id → deploy any run, including an older one to
#                                   roll back
on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "GitHub Actions run ID from the CI workflow to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read # download artifacts from other workflow runs

# One production deploy at a time, across both triggers. Queue rather than
# cancel: cancelling mid-canary would leave Lambda aliases half-shifted between
# versions. Both entry points share this group, so an auto-deploy and a manual
# dispatch can never shift the same aliases concurrently.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Resolve what to deploy ──────────────────────────────────────────────────
  # CI only runs on pull_request, where github.sha is an ephemeral merge-preview
  # commit that never matches any commit reachable from main. That SHA is what
  # got baked into the artifact names when CI uploaded them, and this workflow's
  # own github.sha (the merge commit, or main's HEAD at dispatch time) can never
  # match either. So resolve the real source commit and artifact name from the
  # CI run itself, once, and hand them to every job below.
  resolve:
    name: Resolve CI Run
    # `closed` fires on every close; only a merge should deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      sha: ${{ steps.ci.outputs.sha }}
      lambda_artifact: ${{ steps.ci.outputs.lambda_artifact }}
      pr_number: ${{ steps.ci.outputs.pr_number }}

    steps:
      - name: Resolve CI run, commit and artifacts
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            RUN_ID="${INPUT_RUN_ID}"
            PR=""
          else
            PR="${PR_NUMBER}"
            # The squash/merge commit on main has no CI run and no artifacts —
            # CI ran on the PR head, so that is the SHA to look up.
            echo "PR #${PR} merged, head SHA ${PR_HEAD_SHA}"
            # Newest success wins: a branch can be re-run after a flake.
            RUN_ID=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${PR_HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")]
                    | sort_by(.run_started_at) | last | .id // empty')

            if [ -z "${RUN_ID}" ]; then
              echo "::error::No successful CI run for ${PR_HEAD_SHA} (PR #${PR}). Nothing deployed."
              exit 1
            fi
          fi

          SHA=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .head_sha)

          # Artifacts have 30-day retention. Fail here with something actionable
          # rather than deep in the canary job with an empty artifact name.
          LAMBDA_ARTIFACT=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[]
                   | select(.name | startswith("lambda-artifacts-"))
                   | select(.expired == false)][0].name // empty')

          if [ -z "${LAMBDA_ARTIFACT}" ]; then
            echo "::error::CI run ${RUN_ID} has no unexpired lambda-artifacts-* artifact (30-day retention). Re-run CI on the branch, then dispatch this workflow with the new run ID."
            exit 1
          fi

          echo "Deploying CI run ${RUN_ID} (commit ${SHA}, artifact ${LAMBDA_ARTIFACT})"
          {
            echo "ci_run_id=${RUN_ID}"
            echo "sha=${SHA}"
            echo "lambda_artifact=${LAMBDA_ARTIFACT}"
            echo "pr_number=${PR}"
          } >> "$GITHUB_OUTPUT"
  # ── Backend: Lambda canary deployment ───────────────────────────────────────
  deploy-backend:
    name: Deploy Lambda Canaries
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-southeast-1
      CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve.outputs.lambda_artifact }}
          path: dist/artifacts
          run-id: ${{ needs.resolve.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lambda zips to S3
        run: |
          for zip in dist/artifacts/*.zip; do
            fn=$(basename "$zip" .zip)
            echo "Uploading ${fn}.zip to s3://${ARTIFACTS_BUCKET}/lambdas/${GIT_SHA}/${fn}.zip"
            aws s3 cp "$zip" "s3://${ARTIFACTS_BUCKET}/lambdas/${GIT_SHA}/${fn}.zip"
          done
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}

      - name: Update Lambda functions and deploy canaries
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          FUNCTIONS=(auth-guard session-capabilities-api uploads-api upload-status-api parser-worker statements-api dashboard-api summary-api cost-explorer-api aws-invoices-api invoice-parser-worker aws-invoice-summary-api)
          DEPLOY_IDS=()

          # Pre-flight: every target must already exist in AWS.
          #
          # Terraform creates these functions, their `live` alias, and their
          # CodeDeploy group; Infrastructure Deploy is manual, so a release that
          # adds a Lambda reaches this job before `terraform apply` has run.
          # Without this gate the loop below publishes and traffic-shifts each
          # function that does exist, then aborts on the first one that does
          # not — leaving production half-deployed with no rollback trigger.
          # Checking every target first makes that state unreachable.
          echo "=== Verifying deploy targets exist ==="
          MISSING=()
          for fn in "${FUNCTIONS[@]}"; do
            FUNCTION="cashight-${fn}"
            aws lambda get-function --function-name "${FUNCTION}" >/dev/null 2>&1 \
              || { MISSING+=("${FUNCTION} (function)"); continue; }
            aws lambda get-alias --function-name "${FUNCTION}" --name live >/dev/null 2>&1 \
              || MISSING+=("${FUNCTION} (live alias)")
            # get-application, not get-deployment-group: the deploy role is
            # granted codedeploy:GetApplication but not GetDeploymentGroup, and
            # an AccessDenied here would read as "missing" and block every
            # deploy. Terraform creates the application and its group together,
            # so the application's absence is what flags a new Lambda.
            aws deploy get-application --application-name "${FUNCTION}" >/dev/null 2>&1 \
              || MISSING+=("${FUNCTION} (CodeDeploy application)")
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Deploy aborted before any change: ${#MISSING[@]} target(s) missing in AWS."
            for entry in "${MISSING[@]}"; do
              echo "  missing: ${entry}"
            done
            echo "Run the 'Infrastructure Deploy' workflow with action=apply to"
            echo "create them, then re-run this deploy. Nothing was modified."
            exit 1
          fi
          echo "All ${#FUNCTIONS[@]} deploy targets present"

          for fn in "${FUNCTIONS[@]}"; do
            FUNCTION="cashight-${fn}"
            echo "=== Deploying ${FUNCTION} ==="

            # Update code and publish a new version
            NEW_ARN=$(aws lambda update-function-code \
              --function-name "${FUNCTION}" \
              --s3-bucket "${ARTIFACTS_BUCKET}" \
              --s3-key "lambdas/${GIT_SHA}/${fn}.zip" \
              --publish \
              --query FunctionArn \
              --output text)
            echo "  New version ARN: ${NEW_ARN}"

            # Wait for the update to propagate before publishing canary traffic
            aws lambda wait function-updated --function-name "${FUNCTION}"

            # Resolve the version the live alias currently points to.
            # NOTE: CodeDeploy's Lambda AppSpec wants bare version numbers here
            # (e.g. "1", "2"), not ARNs — passing ARNs fails every deployment
            # with INVALID_LAMBDA_CONFIGURATION before any traffic shifts.
            NEW_VER="${NEW_ARN##*:}"
            CURRENT_VER=$(aws lambda get-alias \
              --function-name "${FUNCTION}" --name live \
              --query FunctionVersion --output text)
            echo "  Current alias version: ${CURRENT_VER}, target version: ${NEW_VER}"

            # Build inline AppSpec for CodeDeploy
            APPSPEC=$(jq -cn \
              --arg name "${FUNCTION}" \
              --arg current "${CURRENT_VER}" \
              --arg target "${NEW_VER}" \
              '{version:"0.0",Resources:[{FunctionAlias:{Type:"AWS::Lambda::Function",Properties:{Name:$name,Alias:"live",CurrentVersion:$current,TargetVersion:$target}}}]}')

            REVISION=$(jq -n --arg content "${APPSPEC}" \
              '{"revisionType":"AppSpecContent","appSpecContent":{"content":$content}}')

            # NOTE: the CLI service name for CodeDeploy is "deploy", not "codedeploy".
            DEPLOY_ID=$(aws deploy create-deployment \
              --application-name "${FUNCTION}" \
              --deployment-group-name "${FUNCTION}-live" \
              --revision "${REVISION}" \
              --query deploymentId \
              --output text)
            echo "  CodeDeploy deployment: ${DEPLOY_ID}"
            DEPLOY_IDS+=("${DEPLOY_ID}")
          done

          # Wait for all canary deployments to succeed before allowing frontend
          echo "=== Waiting for canary deployments ==="
          for deploy_id in "${DEPLOY_IDS[@]}"; do
            echo "  Waiting for ${deploy_id}..."
            aws deploy wait deployment-successful \
              --deployment-id "${deploy_id}"
            echo "  ${deploy_id}: SUCCEEDED"
          done
          echo "All Lambda canary deployments succeeded"
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}

  # ── Frontend: atomic S3 + CloudFront deployment ──────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [resolve, deploy-backend]
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-southeast-1

    steps:
      # Pinned to the exact commit CI tested (not the merge commit, nor main's
      # HEAD at dispatch time), so the production build matches what CI validated.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ci.yaml's "Static export" step only builds `out/` to exercise
      # `pnpm verify:static` — it uses placeholder Cognito values and must
      # never be deployed. Rebuild here with real production values so users
      # get the real Cognito authority/client instead of a fake one.
      - name: Static export (production)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.cashight.nghuy.link
          NEXT_PUBLIC_COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_SPA_CLIENT_ID }}
          NEXT_PUBLIC_APP_ORIGIN: https://cashight.nghuy.link
          NEXT_PUBLIC_ENABLE_AWS_COST_EXPLORER: ${{ vars.NEXT_PUBLIC_ENABLE_AWS_COST_EXPLORER || 'false' }}
          NEXT_PUBLIC_ENABLE_AWS_BILLING_INVOICE: ${{ vars.NEXT_PUBLIC_ENABLE_AWS_BILLING_INVOICE || 'false' }}
        run: NODE_OPTIONS=--disable-warning=DEP0205 pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy frontend to S3 + CloudFront
        run: node scripts/deploy-frontend.mjs
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

      # Release-manifest job records checksums of what was actually deployed —
      # hand it this real build rather than letting it fall back to CI's
      # placeholder-baked export.
      - name: Upload production frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-export-prod-${{ github.run_id }}
          path: out/
          retention-days: 1

  # ── Smoke tests ───────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    # Needed to assume the deploy role: it trusts this environment's subject.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      # A Cognito access token lives one hour, so it cannot be a stored secret —
      # any value committed here is stale long before the next deploy. Mint one
      # per run instead, from the machine client, whose secret is read from the
      # pool rather than kept in GitHub.
      #
      # This must be the client-credentials flow: the API requires the
      # cashight/* scopes, and Cognito grants custom scopes only through OAuth.
      # A token from AdminInitiateAuth or SRP carries
      # `aws.cognito.signin.user.admin` alone and the API answers 403.
      - name: Mint smoke access token
        id: token
        env:
          POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          CLIENT_ID: ${{ vars.COGNITO_SMOKE_CLIENT_ID }}
          HOSTED_UI: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
        run: |
          set -euo pipefail
          SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "${POOL_ID}" --client-id "${CLIENT_ID}" \
            --query 'UserPoolClient.ClientSecret' --output text)
          echo "::add-mask::${SECRET}"

          RESPONSE=$(curl -sS -X POST "${HOSTED_UI}/oauth2/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -u "${CLIENT_ID}:${SECRET}" \
            -d 'grant_type=client_credentials&scope=cashight/read cashight/write')

          TOKEN=$(jq -r '.access_token // empty' <<<"${RESPONSE}")
          if [ -z "${TOKEN}" ]; then
            # The body carries no token, so only the error code is safe to show.
            echo "::error::Could not mint a smoke token: $(jq -r '.error // "unknown_error"' <<<"${RESPONSE}")"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Run smoke tests
        run: node scripts/smoke-serverless.mjs
        env:
          APP_URL: https://next.cashight.nghuy.link
          API_URL: https://api.cashight.nghuy.link
          SMOKE_REQUIRE_NATIVE_AUTH: 'true'
          SMOKE_NATIVE_ACCESS_TOKEN: ${{ steps.token.outputs.token }}

  # ── Release manifest ─────────────────────────────────────────────────────────
  release-manifest:
    name: Record Release Manifest
    needs: [resolve, smoke-tests]
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-southeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      # Downloads the real production build uploaded by deploy-frontend in
      # this same run — not ci.yaml's placeholder-baked export — so checksums
      # reflect what was actually deployed.
      - name: Download frontend artifact (for checksums)
        uses: actions/download-artifact@v8
        with:
          name: frontend-export-prod-${{ github.run_id }}
          path: out

      - name: Create and upload release manifest
        run: node scripts/create-release-manifest.mjs
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}

  # ── Summary ──────────────────────────────────────────────────────────────────
  summary:
    name: Report
    needs: [resolve, deploy-backend, deploy-frontend, smoke-tests, release-manifest]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Write run summary
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          SMOKE_RESULT: ${{ needs.smoke-tests.result }}
          MANIFEST_RESULT: ${{ needs.release-manifest.result }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          TRIGGER: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "# Production Deploy"
            echo ""

            if [ "${RESOLVE_RESULT}" != "success" ]; then
              echo "## Could not resolve a deployable CI run — nothing was deployed."
              exit 0
            fi

            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Lambda canaries | ${BACKEND_RESULT} |"
            echo "| Frontend | ${FRONTEND_RESULT} |"
            echo "| Smoke tests | ${SMOKE_RESULT} |"
            echo "| Release manifest | ${MANIFEST_RESULT} |"
            echo ""

            echo "| | |"
            echo "|---|---|"
            if [ -n "${PR_NUMBER}" ]; then
              echo "| Trigger | merged [PR #${PR_NUMBER}](${REPO_URL}/pull/${PR_NUMBER}) |"
            else
              echo "| Trigger | \`${TRIGGER}\` |"
            fi
            echo "| Deployed commit | [\`${GIT_SHA}\`](${REPO_URL}/commit/${GIT_SHA}) |"
            echo "| Source CI run | [${CI_RUN_ID}](${REPO_URL}/actions/runs/${CI_RUN_ID}) |"
            echo "| Region | \`ap-southeast-1\` |"
            echo ""
            echo "The deployed commit is the branch tip CI tested, not the merge commit on main."
            echo ""
            echo "- [App](https://cashight.nghuy.link) · [API](https://api.cashight.nghuy.link)"
          } >> "$GITHUB_STEP_SUMMARY"
