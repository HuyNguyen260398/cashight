name: v2 Release

# Releases the v2 stack from the cashight-v2 branch (Plan 4c Task 4):
#   image - builds the arm64 backend image, pushes cashight-backend:<sha> to
#           ECR and pins its digest in deploy/cashight/overlays/v2. Argo CD
#           syncs the commit; nothing here holds cluster credentials.
#   spa   - builds the static frontend for cashight-v2.nghuy.link and deploys
#           it to the v2 bucket behind its own CloudFront distribution.
#
# The role (terraform/v2 output github_ci_role_arn) trusts exactly
# repo:HuyNguyen260398/cashight:ref:refs/heads/cashight-v2. Setting
# `environment:` on a job changes the OIDC subject and breaks that trust, so no
# job here uses one; inputs come from repository variables.
on:
  push:
    branches: [cashight-v2]
    paths:
      - 'backend/**'
      - 'packages/**'
      - 'frontend/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/build-servers.mjs'
      - 'scripts/deploy-frontend.mjs'
      - '.github/workflows/v2-release.yaml'
  workflow_dispatch:

# One release at a time: two digest commits must not race on the overlay.
concurrency:
  group: v2-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  image:
    name: Backend image (arm64)
    # The test nodes are t4g (Graviton); build natively instead of under QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: write
    env:
      REPOSITORY: ${{ vars.V2_ECR_REPOSITORY_URL }}
      SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.V2_CI_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"

      # Tags are immutable, so a re-run for the same commit reuses the image.
      - name: Build and push
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "${REPOSITORY#*/}" \
            --image-ids imageTag="${SHA}" >/dev/null 2>&1; then
            echo "cashight-backend:${SHA} already exists; reusing it"
          else
            docker build --platform linux/arm64 -t "${REPOSITORY}:${SHA}" .
            docker push "${REPOSITORY}:${SHA}"
          fi

      - name: Resolve digest
        id: digest
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images --repository-name "${REPOSITORY#*/}" \
            --image-ids imageTag="${SHA}" --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "cashight-backend@${digest}"

      # A push made with GITHUB_TOKEN starts no workflow run, so this commit
      # cannot trigger another release. Pins on top of the branch tip, and
      # retries once if another push landed in between.
      - name: Pin the digest in the v2 overlay
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2; do
            git fetch origin cashight-v2
            git checkout -B cashight-v2 origin/cashight-v2
            bash scripts/platform/pin-image.sh deploy/cashight/overlays/v2 "${REPOSITORY}" "${DIGEST}" "${SHA}"
            if git diff --quiet; then
              echo "overlay already pins ${DIGEST}"
              exit 0
            fi
            git commit -am "chore(deploy): pin cashight-backend ${SHA}"
            if git push origin cashight-v2; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); retrying on the new tip"
          done
          exit 1

  spa:
    name: Frontend (cashight-v2.nghuy.link)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same Cognito pool and SPA client as v1 (decision 4); only the origins differ.
      - name: Static export (v2)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.cashight-v2.nghuy.link
          NEXT_PUBLIC_COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_SPA_CLIENT_ID }}
          NEXT_PUBLIC_APP_ORIGIN: https://cashight-v2.nghuy.link
          NEXT_PUBLIC_ENABLE_AWS_COST_EXPLORER: ${{ vars.NEXT_PUBLIC_ENABLE_AWS_COST_EXPLORER || 'false' }}
          NEXT_PUBLIC_ENABLE_AWS_BILLING_INVOICE: ${{ vars.NEXT_PUBLIC_ENABLE_AWS_BILLING_INVOICE || 'false' }}
        run: NODE_OPTIONS=--disable-warning=DEP0205 pnpm build

      - name: Verify static export
        run: node scripts/verify-static-export.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.V2_CI_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy to S3 + CloudFront
        run: node scripts/deploy-frontend.mjs
        env:
          FRONTEND_BUCKET: ${{ vars.V2_FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.V2_CLOUDFRONT_DISTRIBUTION_ID }}
