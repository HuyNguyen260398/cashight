name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "'plan' previews changes; 'apply' deploys after approval"
        required: true
        type: choice
        options: [plan, apply]
        default: plan

# Both jobs need id-token to assume the IAM role via GitHub OIDC.
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    # Required: cashight-github-infra trusts only subjects of the form
    # repo:<repo>:environment:production, so a job without this cannot assume it.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          working-directory: ${{ github.workspace }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      # Every Terraform variable has a default, so a missing secret does not fail
      # the plan — it silently plans against the wrong value. For these three that
      # means destroying the production Route 53 record and blanking the Cognito
      # IdP credentials and the auth-guard allowlist. Fail loudly instead.
      - name: Verify required Terraform variables are present
        env:
          ALLOWED_EMAIL: ${{ secrets.TF_ALLOWED_EMAIL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TF_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TF_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$ALLOWED_EMAIL" ]              || missing="$missing TF_ALLOWED_EMAIL"
          [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]     || missing="$missing TF_GOOGLE_OAUTH_CLIENT_ID"
          [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ] || missing="$missing TF_GOOGLE_OAUTH_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Planning without them would blank the Cognito Google IdP and the" >&2
            echo "auth-guard allowlist. See docs/aws-cost-review-2026-07.md section 9." >&2
            exit 1
          fi
          echo "All required Terraform variables are present."

      - name: Terraform plan
        env:
          TF_VAR_allowed_email: ${{ secrets.TF_ALLOWED_EMAIL }}
          TF_VAR_google_oauth_client_id: ${{ secrets.TF_GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.TF_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan.bin \
            2>&1 | tee /tmp/tfplan.txt
          echo "::group::Plan summary"
          grep -E "^Plan:|^No changes\." /tmp/tfplan.txt || true
          echo "::endgroup::"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/tfplan.bin
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Terraform Apply
    if: ${{ inputs.action == 'apply' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ github.sha }}
          path: terraform

      # No TF_VAR_* here on purpose: applying a saved plan file uses the variable
      # values already baked into it at plan time, and Terraform rejects variable
      # input alongside a plan file. Keeping the secrets out of this job also keeps
      # them off the approval-gated runner.
      - name: Terraform apply
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan.bin
